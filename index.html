<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff9fb" />
  <meta name="description" content="모바일에서 시나리오 지문을 원터치 복사하고 판정과 엔딩 분기를 선택하는 TRPG 진행 도우미" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>씬플로우 · TRPG 시나리오 진행기</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="씬플로우">
        <div class="brand-mark" aria-hidden="true">✳</div>
        <div><strong>씬플로우</strong><small>TRPG SCENARIO PLAYER</small></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost compact" id="toggle-split" type="button" aria-pressed="false" title="분할화면 전용 간단 모드">▣ <span class="optional-text">분할</span></button>
        <button class="btn btn-ghost compact" id="open-library" type="button" title="내 시나리오"><span aria-hidden="true">▦</span> <span class="optional-text">내 시나리오</span></button>
        <button class="btn btn-ghost compact" id="open-settings" type="button" title="도구 모음"><span aria-hidden="true">⚙</span> <span class="optional-text">설정</span></button>
        <button class="btn btn-primary compact" id="open-import" type="button"><span aria-hidden="true">＋</span><span class="import-label"> 시나리오</span></button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="시나리오 목록과 장면 탐색"></aside>
      <main class="main-panel">
        <div class="tabs" role="tablist" aria-label="작업 메뉴">
          <button class="tab active" data-tab="play" role="tab" aria-selected="true">▶ 플레이</button>
          <button class="tab" data-tab="edit" role="tab" aria-selected="false">✎ 편집</button>
          <button class="tab" data-tab="source" role="tab" aria-selected="false">▤ 원문 검색</button>
        </div>
        <div id="view" class="view" aria-live="off"></div>
      </main>
    </div>
    <nav class="mobile-nav" aria-label="하단 메뉴">
      <button data-tab="play" class="mobile-tab active"><span>▶</span>플레이</button>
      <button data-tab="edit" class="mobile-tab"><span>✎</span>편집</button>
      <button data-tab="source" class="mobile-tab"><span>⌕</span>원문</button>
      <button id="mobile-scenes" class="mobile-tab"><span>☷</span>장면</button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
